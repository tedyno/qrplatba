name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      # The test suite runs in Bun against the sources; this verifies the
      # shipped dist/ output loads and works in plain Node (CJS + ESM).
      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Smoke test dist in Node
        run: node scripts/smoke.mjs
